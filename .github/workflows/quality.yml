name: quality
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Secret scanning. This walks the entire history on every run rather than the
  # commits a given push happened to carry. The vendor's action does the latter,
  # deriving its range from the push payload as
  # `<first pushed commit>^..<last pushed commit>` — which git cannot resolve
  # whenever a push begins at a root commit, i.e. the first push of a repository
  # or any force-push of rewritten history, because a root commit has no parent.
  # A full scan depends on nothing but the checkout, so no event shape can
  # malform it, and it cannot quietly skip commits that fall outside a range.
  # The trade is that a secret reaching history keeps this red until the history
  # is rewritten, which is the intended behaviour: the leak is real until then.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Every commit, not a diff — the scan below needs the full history.
        with: { fetch-depth: 0 }
      - name: scan history for secrets
        env:
          # Pinned so an upstream rule change cannot turn an untouched branch
          # red on its own. Bump in step with the local pre-commit hook, so a
          # commit that passes locally is judged by the same ruleset here.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          curl -sSfL "$base/$tarball" -o "$tarball"
          # Pinning a version only means something if we check we got that
          # version; a scanner is a poor thing to fetch on trust.
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1

  # Required check (set in branch protection). Typecheck, the import-boundary
  # rule that keeps the package layout honest, and the test suite, which carries
  # the domain engine's property tests.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The app is the only thing here with a bundler, and nothing else would
      # notice it stopped producing a page.
      - run: npm run build
      # The two strings this product renders and did not write are extracted
      # game text and the player's own notes, and both reach the page as text,
      # which the renderer escapes. There is exactly one way to opt out of that,
      # so it is refused here rather than left to review. The pattern matches
      # the prop being set, not the name being mentioned, so prose explaining
      # the rule does not trip it.
      - name: refuse the escaping opt-out
        run: |
          set -uo pipefail
          if grep -rnE "dangerouslySetInnerHTML[[:space:]]*[=:]" packages apps \
               --include="*.ts" --include="*.tsx"; then
            echo "::error::text rendered as markup"
            exit 1
          fi
          exit 0

  # Python tool (data-extract). Runs the synthetic fixtures — the only extractor
  # coverage that can run here, since the real dump is not in the repo.
  extractor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: run extractor fixtures
        run: |
          pip install pytest
          pytest tools/data-extract/
        # The snapshot starts from committed synthetic JSON dumps, so this needs
        # neither a Lua interpreter nor a game install. What it cannot see is
        # grammar drift: a patch that changes the shape of the real data leaves
        # every fixture green, and only the local drift check against the stored
        # extraction catches that.
