  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The content security policy is injected here at build time and is written
      in vite.config.ts. It used to sit in this file as a literal, which put it
      on the dev server too — where it blocks the live-reload client's inline
      script and every style Vite injects, so the page came up unstyled with no
      hint as to why. The comment beside it always said it belonged to the built
      site only; nothing made that true.
    -->
    <title>Hades Handbook</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
